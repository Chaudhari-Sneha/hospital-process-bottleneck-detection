# =============================================================================
# CALIBRATION PARAMETERS for the synthetic Indian hospital log (Steps 3 and 4)
# =============================================================================
#
# THE RULE (project standing design rule): every parameter carries a `source`.
# "Where did 95 minutes come from?" must be answerable by opening this one file.
#
# Each parameter also carries a `status`, because a source alone still lets a
# guess hide in plain sight:
#
#   verified    - primary document read in full, OR measured by us from the real
#                 Sepsis log with a named script. Safe to quote.
#   secondary   - a real citation, but the original has not been read in context.
#                 Usable, but say so in the report. (Step 2c lesson: a number
#                 known only through a search summary is hearsay, not evidence.)
#   placeholder - a working guess with NO source yet. MUST be replaced before any
#                 result that depends on it is quoted anywhere.
#
# Why the third value exists: a number you invented and a number you verified
# look identical once they are a float in a Python file. This makes the gaps
# visible and countable instead of letting them dissolve into the code.
#
# `src/06_check_calibration.py` counts them and refuses to certify a run whose
# headline outputs depend on a placeholder.
#
# TRANSFER ASSUMPTION - state this in the report, do not bury it:
#   The real log we validated against (Sepsis, Steps 1-2) is a DUTCH hospital.
#   We calibrate process STRUCTURE from it - the lab repeat-test loop, the ward
#   cadence, the lab-to-discharge handoff - because we measured those ourselves.
#   We do NOT assume the MAGNITUDES transfer to an Indian hospital. Every
#   parameter therefore declares `applies_to: structure` or `applies_to: magnitude`
#   so the two kinds of borrowing are never confused.
# =============================================================================

meta:
  version: 1
  created: 2026-09-17
  purpose: >
    Parameters for the SimPy generator that produces a synthetic Indian hospital
    event log with BOTH start and complete timestamps, tagged by payment_mode,
    so that queueing time and processing time can be separated - the one thing
    the real Sepsis log provably cannot do (proven in Step 1).
  status_values: [verified, secondary, assumption, placeholder]

# -----------------------------------------------------------------------------
# 1. REGULATORY DEADLINES - the clock the process is measured against
# -----------------------------------------------------------------------------
# These are the Indian equivalent of the Sepsis log's "antibiotics within 1 hour"
# clinical target: a mandated deadline that a real process routinely misses.
regulatory:
  source_document:
    reference: "IRDAI/HLT/CIR/PRO/84/5/2024"
    date: "2024-05-29"
    title: "Master Circular on IRDAI (Insurance Products) Regulations 2024 - Health Insurance"
    url: "https://irdai.gov.in/health-dept"
    status: verified
    source: "the circular PDF itself, page 2 header - retrieved from irdai.gov.in"
    note: >
      Reference number and date read from page 2 of the circular PDF itself, not
      from a secondary source. Secondary sources circulate a second number
      (IRDAI/HLT/CIR/MISC/77/05/2024) which does NOT appear on this document -
      cite the one above.

  cashless_preauth_decision_max:
    value: 60
    unit: minutes
    applies_to: magnitude
    status: verified
    source: "IRDAI/HLT/CIR/PRO/84/5/2024, clause 15(b)"
    quote: >
      "Insurer shall decide on the request for cashless authorization immediately
      but not more than one hour of receipt of request. Necessary systems and
      procedures shall be put in place by the Insurer immediately and not later
      than 31st July, 2024."

  discharge_final_authorization_max:
    value: 180
    unit: minutes
    applies_to: magnitude
    status: verified
    source: "IRDAI/HLT/CIR/PRO/84/5/2024, clause 16(a)"
    quote: >
      "Insurer shall grant final authorization within three hours of the receipt
      of discharge authorization request from the hospital. In no case, the
      policyholder shall be made to wait to be discharged from the Hospital."

  breach_penalty:
    value: "insurer bears the additional hospital charges"
    status: verified
    source: "IRDAI/HLT/CIR/PRO/84/5/2024, clause 16(b)"
    quote: >
      "If there is any delay beyond three hours, the additional amount if any
      charged by the hospital shall be borne by the insurer from shareholder's
      fund."
    note: >
      RESOLVED. The word "shareholder's" was initially lost in text extraction
      because the circular renders it in a DIFFERENT EMBEDDED FONT (/F6) as
      CID-encoded glyph IDs, while the rest of the sentence is in /F4 as plain
      text. Recovered by decoding the glyph run
      <0056004B><0044><00550048004B><0052><004F00470048><005500B6><0056>
      (GIDs 86,75,68,85,72,75,82,79,71,72,85,182,86; this subset font maps
      GID+29 to ASCII, and GID 182 is the typographic apostrophe) -> "shareholder's".
      Verified from the PDF itself, not from secondary sources, which happened to
      agree. Safe to quote clause 16(b) verbatim.

# -----------------------------------------------------------------------------
# 2. WHAT WE MEASURED OURSELVES on the real log (Steps 2a-2d)
# -----------------------------------------------------------------------------
# These are `verified` in the strongest available sense: we computed them, from a
# public log, with a script in this repo, using a pipeline that reproduces the
# published antibiotics-breach rate to within 0.1 percentage points (Step 2c).
measured_from_sepsis_log:
  applies_to: structure
  caveat: >
    Dutch hospital. Use these to shape the PROCESS - that a lab repeat-test loop
    exists, that wards run on a daily cadence, that the final handoff before
    discharge is the long one. Do not present the magnitudes as Indian figures.

  lab_turnaround_er:
    value: 13
    unit: minutes
    status: verified
    source: "src/03_department_handoffs.py - median gap, group A/C/L -> group B"
    note: "Stat bloods drawn at presentation. 1,049 observations."

  lab_turnaround_ward:
    value: [18.0, 35.5]
    unit: hours
    status: verified
    source: "src/03_department_handoffs.py - median gap, ward groups -> group B"
    note: >
      Consistent across ~11 independent ward codes, which is what makes it a
      systemic cadence rather than one bad ward. IMPORTANT: this interval fuses
      "when the test was ordered" with "how fast the lab ran it" - the Step 1
      limitation. It is evidence of a ~24h repeat-test CADENCE, not of lab speed.
      The whole point of the SimPy generator is to stop fusing these.

  repeat_test_interval_ward:
    value: 24
    unit: hours
    status: verified
    source: "src/03_department_handoffs.py - B->B median of non-zero gaps"
    note: >
      Lab-to-lab is 6,114 gaps, 44.6% of ALL waiting time in the log. 71.8% are
      exactly zero (batch data entry); the remaining 1,722 have a 24.0h median.

  final_handoff_to_discharge:
    value: 32
    unit: hours
    p90: 102
    status: verified
    source: "src/03_department_handoffs.py - group B -> group E, 637 observations"
    note: >
      THE headline finding of Step 2: last lab result to discharge desk. This is
      the structural analogue of the IRDAI 3-hour discharge rule - here it runs at
      32 hours with no insurer involved at all. Carry this comparison into Step 6.

  internal_vs_handoff_split:
    value: {internal_pct: 45.0, handoff_pct: 55.0}
    status: verified
    source: "src/03_department_handoffs.py"
    note: "55% of waiting time is BETWEEN departments, not inside them."

