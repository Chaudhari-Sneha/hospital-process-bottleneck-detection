# -----------------------------------------------------------------------------
# 5. ECONOMICS - for the Step 8 business case
# -----------------------------------------------------------------------------
economics:
  arpob_benchmark:
    value: 67361
    unit: INR per occupied bed day
    applies_to: external_benchmark
    status: verified
    source: >
      Global Health Limited (Medanta), Investor Presentation for the third
      quarter and nine months ended 31 December 2025, filed 4 February 2026 with
      BSE (Scrip Code 543654) and NSE (Symbol MEDANTA) under Regulation 30 of
      SEBI (LODR) Regulations 2015. Network ARPOB for Q3 FY2026.
    quarter: "Q3 FY2026 (Oct-Dec 2025)"
    filing_date: "2026-02-04"
    company_definition: >
      VERBATIM from the filing's own footnote: "ARPOB is calculated on Hospital
      Revenues excluding Pharmacy and Other Income divided by Occupied bed days".
    supporting_metrics:
      occupied_bed_days: 154917
      alos_days: 3.02
      occupancy_pct: 59
      installed_beds: 3550
      yoy_change_pct: 9.9
      matured_hospitals_arpob: 76414
    note: >
      THIS IS AN EXTERNAL INDIAN BENCHMARK. It is NOT the ARPOB of the Dutch
      hospital whose log was analysed in Steps 1-2, and it is NOT a measured
      property of the synthetic hospital. It is a real, citable Indian figure
      used to give the bed-hour result an order of magnitude.

      THREE CAVEATS THAT MUST BE QUOTED WITH IT:
      1. Medanta is a quaternary, high-acuity chain (ALOS 3.02 days). Its ARPOB
         sits at the UPPER end of Indian hospitals, so any rupee figure derived
         from it is an optimistic benchmark, not a median Indian hospital.
      2. The definition EXCLUDES pharmacy and other income, so the revenue base
         is narrower than total hospital revenue - this pulls the estimate the
         other way, and the two biases do not cancel in any known proportion.
      3. Revenue is not profit, and a freed bed-hour only becomes revenue if a
         patient is waiting to occupy it. ARPOB x bed-hours is an UPPER BOUND ON
         OPPORTUNITY, never a cash saving.

      A newer Q1 FY2027 figure of approximately INR 70,244 appears in secondary
      coverage but could NOT be verified against the filing itself, so it is
      deliberately not used. See the Tier A/Tier B rule established in Step 2c.

  arpob_of_study_hospital:
    value: null
    unit: INR per occupied bed day
    applies_to: magnitude
    status: placeholder
    source: "NOT AVAILABLE - the analysed log is a Dutch hospital with no disclosed ARPOB"
    note: >
      Kept as an explicit placeholder so the distinction is visible in the audit:
      we have a benchmark to illustrate with, we do NOT have the study hospital's
      own revenue per bed day, and no rupee figure may be presented as that
      hospital's actual loss.

# -----------------------------------------------------------------------------
# 6. SIMULATION ASSUMPTIONS - the hospital we are choosing to model
# -----------------------------------------------------------------------------
# A simulator needs values that are NOT claims about the world: how many
# registration clerks exist, how long a clerk takes with one patient. These are
# properties of the hypothetical hospital being modelled. They are not findings,
# they are not sourced, and pretending otherwise would be the exact failure this
# file exists to prevent.
#
# So they get their own status: `assumption`.
#   placeholder - a hole where a real source is expected and findable.
#   assumption  - a declared modelling choice. Results are CONDITIONAL on it and
#                 must be reported that way.
#
# Where an assumption stands in for something that really should be sourced, it
# says so via `stands_in_for`, so the audit can report that link rather than
# letting the assumption quietly discharge the obligation.
#
# SERVICE TIMES are triangular: [shortest, most likely, longest] in minutes.
# Triangular because it is the distribution you can actually elicit from a person
# who runs the desk - "best case, usual, bad day" - rather than one that needs
# fitting to data we do not have.
simulation_assumptions:

  arrival_interval_mean:
    value: 12
    unit: minutes
    status: assumption
    source: "modelling choice - yields roughly 120 arrivals/day"

  payment_mode_cashless_share:
    value: 0.55
    status: assumption
    stands_in_for: insurance_branch.payment_mode_split
    source: "modelling choice pending a real payer-mix source"

  probability_admitted:
    value: 0.35
    status: assumption
    source: "modelling choice - share of ER arrivals admitted to a ward"
    note: >
      For orientation only, the real Sepsis log ran at ~77% admitted, but that is
      a sepsis-suspicion cohort and not comparable to general ER arrivals.

  length_of_stay_days:
    value: [2, 4, 9]
    unit: days
    status: assumption
    stands_in_for: indian_process.ward_length_of_stay
    source: "modelling choice - triangular"

  capacity:
    value:
      registration_clerks: 3
      triage_nurses: 2
      doctors: 4
      lab_stations: 12
      beds: 260
      insurance_desk_staff: 8
      tpa_reviewers: 30
    status: assumption
    source: "modelling choice, constrained by a queueing-stability check"
    note: >
      Capacity is what makes queues form. These numbers ARE the experiment: the
      bottleneck the pipeline finds is a consequence of them, so they must be
      reported alongside any result, and varied to show the finding is not an
      artefact of one arbitrary configuration.

      THESE ARE NOT FREE CHOICES. Every resource must satisfy rho < 1, where
      rho = (arrival rate x mean service time) / capacity. If rho >= 1 the queue
      grows without bound and the simulation measures a BACKLOG BUILDING UP, not
      a hospital operating - and any comparison drawn from it is an artefact of
      run length rather than a finding.

      The first version of this file used beds: 60, lab_stations: 6,
      insurance_desk_staff: 2, tpa_reviewers: 5. All four were unstable - beds
      carried an offered load of ~210 against a capacity of 60 - which produced
      an 88-hour bed wait that was pure transient. `src/07_generate_synthetic_log.py`
      now computes rho for every resource before running and refuses to proceed
      if any is >= 1, so this class of error cannot recur silently.

  service_times:
    value:
      registration: [3, 6, 15]
      triage: [4, 8, 20]
      consultation: [8, 15, 35]
      lab_test: [20, 45, 120]
      insurance_desk_prepare_request: [15, 30, 60]
      tpa_review: [30, 60, 240]
      tpa_document_query_rework: [60, 180, 480]
      billing_self_pay: [20, 40, 90]
    unit: minutes
    status: assumption
    source: "modelling choice - triangular [shortest, usual, longest]"

  ward_round_interval:
    value: 24
    unit: hours
    status: assumption
    source: "shaped by measured_from_sepsis_log.repeat_test_interval_ward"
    note: "Structure borrowed from the real log; see the transfer assumption above."

# -----------------------------------------------------------------------------
# 7. SENSITIVITY PARAMETERS - swept, never quoted as point estimates
# -----------------------------------------------------------------------------
# The project's central hypothesis (CLAUDE.md): the real cause of discharge delay
# is repeated document-query loops between the hospital insurance desk and the
# TPA, not the regulatory clock itself.
#
# We could not source a value for how often that loop fires. The honest response
# is NOT to pick a plausible number - it is to sweep the range and report where
# the conclusion holds and where it flips.
sensitivity:
  document_query_probability:
    value: 0.45
    sweep: [0.0, 0.15, 0.30, 0.45, 0.60, 0.75]
    status: assumption
    stands_in_for: insurance_branch.preauth_query_loop_probability
    source: "UNSOURCED - swept, not estimated"
    note: >
      Probability that a submitted authorization request returns as a document
      query instead of a decision. `value` is the baseline used for a single run;
      `sweep` is what Step 5 must actually report across. Any headline number
      quoted from a single value of this parameter is a misuse of this study.

  max_query_loops:
    value: 4
    status: assumption
    source: "modelling choice - cap so the simulation terminates"
